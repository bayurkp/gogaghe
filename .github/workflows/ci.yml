name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 'latest'

      - name: Lint Protobuf
        run: buf lint api/proto

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary (Zero Cgo)
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/gogaghe-server ./cmd/gogaghe-server/...
