// api/proto/gogaghe/v1/gogaghe.proto
syntax = "proto3";

package gogaghe.v1;

option go_package = "github.com/bayurkp/gogaghe/pkg/gogaghe/v1;gogaghev1";

service GogagheService {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Single-strategy dedicated search RPCs:
  rpc SurfaceSearch(SurfaceSearchRequest) returns (SurfaceSearchResponse); // Character N-gram (Surface / Typo-tolerant)
  rpc Bm25Search(Bm25SearchRequest)       returns (Bm25SearchResponse);    // BM25 Inverted Index (Probabilistic Lexical)
  rpc LexicalSearch(LexicalSearchRequest) returns (LexicalSearchResponse); // Alias for Bm25Search
  rpc TfidfSearch(TfidfSearchRequest)     returns (TfidfSearchResponse);   // Salton TF-IDF (Vector Space Model)
  rpc LsaSearch(LsaSearchRequest)         returns (LsaSearchResponse);     // Latent Semantic Analysis (Truncated SVD)
  rpc VectorSearch(VectorSearchRequest)   returns (VectorSearchResponse);  // Dense Vector (Cosine Similarity)

  // Multi-strategy fused hybrid search RPC:
  rpc HybridSearch(HybridSearchRequest)   returns (HybridSearchResponse);  // RRF fusion across selected or all strategies
}

// SearchStrategy specifies the matching strategy to use in search queries.
enum SearchStrategy {
  SEARCH_STRATEGY_UNSPECIFIED    = 0; // Automatically enables all strategies matching provided query/vector fields
  SEARCH_STRATEGY_SURFACE_NGRAM  = 1; // Character N-gram (Surface / Typo tolerance / Substring)
  SEARCH_STRATEGY_LEXICAL_BM25   = 2; // Okapi BM25 Inverted Index (Lexical probabilistic keyword)
  SEARCH_STRATEGY_LEXICAL_TFIDF  = 3; // Salton TF-IDF (Lexical term frequency-inverse document frequency)
  SEARCH_STRATEGY_SEMANTIC_LSA   = 4; // Latent Semantic Analysis (Truncated SVD statistical semantics)
  SEARCH_STRATEGY_SEMANTIC_DENSE = 5; // Dense Vector Cosine Similarity (Deep neural embeddings)
}

// --- Set ---
message SetRequest {
  string         key        = 1;
  bytes          value      = 2;
  int64          ttl_ms     = 3; // 0 = no expiry
  int64          cost_ms    = 4; // ComputationCostMs for eviction scoring
  repeated float vector     = 5; // optional pre-computed vector
  bool           auto_embed = 6; // trigger async embedding from value
}

message SetResponse {
  bool success = 1;
}

// --- Get ---
message GetRequest {
  string key = 1;
}

message GetResponse {
  bool           found        = 1;
  bytes          value        = 2;
  repeated float vector       = 3;
  int64          access_count = 4;
}

// --- Delete ---
message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool deleted = 1;
}

// --- SurfaceSearch (Character N-gram) ---
message SurfaceSearchRequest {
  string query = 1;
  int32  top_k = 2;
}

message SurfaceSearchResponse {
  repeated SearchResult results = 1;
}

// --- Bm25Search (Lexical BM25) ---
message Bm25SearchRequest {
  string query = 1;
  int32  top_k = 2;
}

message Bm25SearchResponse {
  repeated SearchResult results = 1;
}

// --- LexicalSearch (Alias for BM25) ---
message LexicalSearchRequest {
  string query = 1;
  int32  top_k = 2;
}

message LexicalSearchResponse {
  repeated SearchResult results = 1;
}

// --- TfidfSearch (Lexical TF-IDF) ---
message TfidfSearchRequest {
  string query = 1;
  int32  top_k = 2;
}

message TfidfSearchResponse {
  repeated SearchResult results = 1;
}

// --- LsaSearch (Latent Semantic SVD) ---
message LsaSearchRequest {
  string query = 1;
  int32  top_k = 2;
}

message LsaSearchResponse {
  repeated SearchResult results = 1;
}

// --- VectorSearch (Dense Vector Cosine) ---
message VectorSearchRequest {
  string         query        = 1; // optional: query text to auto-embed if query_vector is omitted
  repeated float query_vector = 2; // optional: pre-computed semantic query vector
  int32          top_k        = 3;
}

message VectorSearchResponse {
  repeated SearchResult results = 1;
}

// --- HybridSearch (RRF Fusion) ---
message HybridSearchRequest {
  string                  query        = 1; // query text for surface/lexical/lsa
  repeated float          query_vector = 2; // dense semantic query vector
  int32                   top_k        = 3;
  float                   rrf_k        = 4; // RRF constant, default 60.0
  repeated SearchStrategy strategies   = 5; // Optional: specify exact strategies to fuse (if empty, auto-detects from provided fields)
}

message HybridSearchResponse {
  repeated SearchResult results = 1;
}

// --- Shared ---
message SearchResult {
  string key   = 1;
  bytes  value = 2;
  float  score = 3;
}
