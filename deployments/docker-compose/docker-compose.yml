# deployments/docker-compose/docker-compose.yml
services:
  gogaghe:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile
    ports:
      - "50051:50051"
      - "2112:2112"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # AI embedding sidecar — activate with: docker compose --profile ai-bundle up
  embedder:
    profiles:
      - ai-bundle
    image: semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
    ports:
      - "8000:8080"
    environment:
      - ENABLE_CUDA=0
    restart: unless-stopped
